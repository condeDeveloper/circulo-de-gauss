name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/CirculoDeGauss/CirculoDeGauss.csproj -c Release
      - run: dotnet test testes/CirculoDeGauss.Testes/CirculoDeGauss.Testes.csproj -c Release
      - run: dotnet run --project ferramentas/Medidor -c Release -- erro
      - run: dotnet run --project ferramentas/Medidor -c Release -- contagens
      - run: dotnet run --project ferramentas/Medidor -c Release -- expoente
      - run: dotnet run --project ferramentas/Medidor -c Release -- borda
